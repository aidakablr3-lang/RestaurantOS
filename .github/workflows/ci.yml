name: CI

on:
  push:
    branches: [main, develop, "feature/**"]
  pull_request:
    branches: [main, develop]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHON_VERSION: "3.13"
  NODE_VERSION: "20"
  # Every job below that needs a JWT keypair generates its own
  # throwaway RS256 pair inline (see the "Generate a throwaway RS256
  # keypair" steps) rather than relying on any locally-generated dev
  # keypair -- a workflow run's logs are exactly the kind of place a
  # leaked "dev" secret could get scraped from, so CI never reuses one.
  JWT_ISSUER: restaurantos-ci

jobs:
  backend-lint:
    name: Backend / lint & format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: services/api/pyproject.toml
      - run: pip install -e ".[dev]"
        working-directory: services/api
      - run: ruff format --check .
        working-directory: services/api
      - run: ruff check .
        working-directory: services/api

  backend-typecheck:
    name: Backend / type check (advisory)
    runs-on: ubuntu-latest
    # Non-blocking: started as 5 pre-existing mypy findings (see
    # docs/AI_HANDOFF.md) and has grown to 49 as of 2026-08-26 --
    # almost all the same DomainEvent Protocol/ClassVar mismatch
    # repeated across ~20 event classes (OutboxWriter.publish()'s
    # DomainEvent Protocol declares aggregate_type/event_type as
    # instance variables; every concrete event class defines them as
    # class variables). A real fix means either widening the Protocol
    # or converting those classes -- a design decision, not something
    # to make incidentally. Reporting here keeps it visible without
    # gating merges on a pre-existing gap.
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: services/api/pyproject.toml
      - run: pip install -e ".[dev]"
        working-directory: services/api
      - run: mypy src/
        working-directory: services/api

  backend-test:
    name: Backend / unit + integration tests
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: restaurantos
          POSTGRES_PASSWORD: restaurantos
          POSTGRES_DB: restaurantos_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U restaurantos"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: services/api/pyproject.toml
      - run: pip install -e ".[dev]"
        working-directory: services/api
      - name: Generate a throwaway RS256 keypair for this run
        run: |
          openssl genrsa -out /tmp/ci_jwt_private.pem 2048
          openssl rsa -in /tmp/ci_jwt_private.pem -pubout -out /tmp/ci_jwt_public.pem
          {
            echo "JWT_PRIVATE_KEY<<EOF"
            cat /tmp/ci_jwt_private.pem
            echo "EOF"
            echo "JWT_PUBLIC_KEY<<EOF"
            cat /tmp/ci_jwt_public.pem
            echo "EOF"
          } >> "$GITHUB_ENV"
      - name: Run full backend suite (unit + integration)
        working-directory: services/api
        env:
          TEST_DATABASE_URL: postgresql+asyncpg://restaurantos:restaurantos@localhost:5432/restaurantos_test
        run: python -m pytest tests/ -v

  frontend:
    name: Frontend / typecheck, lint, build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: apps/admin-web/package-lock.json
      - run: npm ci
        working-directory: apps/admin-web
      - run: npx tsc --noEmit
        working-directory: apps/admin-web
      - run: npx eslint .
        working-directory: apps/admin-web
      - run: npm run build
        working-directory: apps/admin-web

  e2e:
    name: End-to-end (Playwright)
    runs-on: ubuntu-latest
    needs: [backend-test, frontend]
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: restaurantos
          POSTGRES_PASSWORD: restaurantos
          POSTGRES_DB: restaurantos
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U restaurantos"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: services/api/pyproject.toml
      - run: pip install -e ".[dev]"
        working-directory: services/api

      - name: Generate a throwaway RS256 keypair for this run
        run: |
          openssl genrsa -out /tmp/ci_jwt_private.pem 2048
          openssl rsa -in /tmp/ci_jwt_private.pem -pubout -out /tmp/ci_jwt_public.pem
          {
            echo "JWT_PRIVATE_KEY<<EOF"
            cat /tmp/ci_jwt_private.pem
            echo "EOF"
            echo "JWT_PUBLIC_KEY<<EOF"
            cat /tmp/ci_jwt_public.pem
            echo "EOF"
          } >> "$GITHUB_ENV"

      - name: Migrate and start the backend
        working-directory: services/api
        env:
          DATABASE_URL: postgresql+asyncpg://restaurantos:restaurantos@localhost:5432/restaurantos
          CORS_ALLOWED_ORIGINS: http://localhost:3000
          APP_ENV: development
        run: |
          python -m alembic upgrade head
          python -m uvicorn restaurant_os_api.main:app --host 127.0.0.1 --port 8000 &
          for i in $(seq 1 30); do
            curl -sf http://127.0.0.1:8000/health/live && break
            sleep 1
          done
          curl -sf http://127.0.0.1:8000/health/live

      - name: Seed the E2E platform-admin fixture
        working-directory: services/api
        env:
          DATABASE_URL: postgresql+asyncpg://restaurantos:restaurantos@localhost:5432/restaurantos
        run: |
          python scripts/seed_e2e_fixtures.py | tee /tmp/seed_output.txt
          echo "E2E_ADMIN_TENANT_ID=$(grep -oP 'E2E_TENANT_ID=\K.*' /tmp/seed_output.txt)" >> "$GITHUB_ENV"

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: apps/admin-web/package-lock.json
      - run: npm ci
        working-directory: apps/admin-web
      - run: npx playwright install --with-deps chromium
        working-directory: apps/admin-web

      - name: Run Playwright E2E suite
        working-directory: apps/admin-web
        env:
          CI: "true"
          E2E_API_BASE_URL: http://localhost:8000
          # playwright.config.ts's webServer defaults to port 3100 (to
          # avoid colliding with a developer's own `npm run dev` on
          # 3000), but the backend above only allows CORS from
          # localhost:3000 (see CORS_ALLOWED_ORIGINS in the "Migrate and
          # start the backend" step). Pin E2E_PORT to 3000 here so the
          # frontend's actual origin matches what the backend allows --
          # otherwise every browser request in this suite gets rejected
          # by CORS before it reaches the API.
          E2E_PORT: "3000"
        run: npm run e2e

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: apps/admin-web/playwright-report/
          retention-days: 7
