# Production orchestration for a single-VPS hotel pilot deployment.
#
# Companion to docker-compose.yml (dev). Runs Postgres + the API as
# immutable containers behind whatever reverse proxy terminates HTTPS on
# the host (Caddy is recommended -- see
# infrastructure/reverse-proxy/Caddyfile.example and
# docs/RestaurantOS_Production_Deployment_Guide.md).
#
# apps/admin-web is deliberately NOT containerized here, consistent with
# docker-compose.yml's own dev-time choice: `next build && next start`
# under a process supervisor (systemd unit example:
# infrastructure/systemd/restaurantos-web.service.example) is simpler
# than adding a second image to build/version/redeploy for a one-VPS
# pilot, and Next.js's own production server is already a single
# long-running Node process -- there is nothing Docker adds here that a
# supervisor doesn't already give you at this scale.
#
# Requires a real .env file (NOT committed -- see .env.example) with at
# minimum: DATABASE_PASSWORD, JWT_PRIVATE_KEY, JWT_PUBLIC_KEY,
# CORS_ALLOWED_ORIGINS. See the deployment guide's "Environment
# Variables" section for the full table and where each value comes from.

services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${DATABASE_USER:-restaurantos}
      POSTGRES_PASSWORD: ${DATABASE_PASSWORD:?DATABASE_PASSWORD must be set in .env}
      POSTGRES_DB: ${DATABASE_NAME:-restaurantos}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    # Not published to the host's public interface on purpose -- only
    # the api service (same Docker network) and this host's own backup
    # cron job (via `docker exec`, see the deployment guide's "Backup"
    # section) need to reach it. Bind to loopback only if you need
    # host-side psql access for troubleshooting.
    ports:
      - "127.0.0.1:5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DATABASE_USER:-restaurantos}"]
      interval: 10s
      timeout: 5s
      retries: 10

  api:
    build:
      context: ./services/api
      dockerfile: ../../infrastructure/docker/api-prod/Dockerfile
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      APP_ENV: production
      DATABASE_URL: postgresql+asyncpg://${DATABASE_USER:-restaurantos}:${DATABASE_PASSWORD}@postgres:5432/${DATABASE_NAME:-restaurantos}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:?CORS_ALLOWED_ORIGINS must be set to the real pilot frontend origin}
      JWT_PRIVATE_KEY: ${JWT_PRIVATE_KEY:?JWT_PRIVATE_KEY must be set -- see docs/RestaurantOS_Production_Deployment_Guide.md}
      JWT_PUBLIC_KEY: ${JWT_PUBLIC_KEY:?JWT_PUBLIC_KEY must be set}
    # Bound to loopback -- the reverse proxy (Caddy, on the host or its
    # own container sharing this network) is the only thing that should
    # ever reach this port directly.
    ports:
      - "127.0.0.1:8000:8000"

volumes:
  postgres_data:
