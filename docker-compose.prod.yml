# Production orchestration -- single-VPS deployment
# (api.prashanthai.com / admin.prashanthai.com).
#
# Companion to docker-compose.yml (dev). Four services, all reached from
# outside the host only through Caddy on 80/443 -- postgres, api, and
# admin-web publish no host ports at all; they are reachable solely on
# Compose's own default project network, by service name
# (postgres/api/admin-web). This is a stricter posture than an earlier
# draft of this file, which bound postgres/api to 127.0.0.1 -- reachable
# from the host's own network stack, if nothing else. Reachable from
# *outside the host* was already false either way; this version is also
# unreachable from the host's own loopback, which nothing here needs.
#
# admin-web is containerized here (a change from the project's dev-time
# precedent of running Next.js directly via a process supervisor) because
# this deploy puts Caddy itself in Docker too -- once Caddy is a container
# on the same network, reverse-proxying to a sibling container by service
# name is simpler than reverse-proxying from a container back out to a
# systemd-managed host process. See docs/DEPLOYMENT.md.
#
# Requires a real .env file at the repo root (NOT committed -- see
# .env.production.example) with at minimum: DATABASE_PASSWORD,
# JWT_PRIVATE_KEY, JWT_PUBLIC_KEY, CORS_ALLOWED_ORIGINS,
# NEXT_PUBLIC_API_BASE_URL, CADDY_ACME_EMAIL. scripts/deploy/ generates
# and writes this file on the box -- see docs/DEPLOYMENT.md.

services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${DATABASE_USER:-restaurantos}
      POSTGRES_PASSWORD: ${DATABASE_PASSWORD:?DATABASE_PASSWORD must be set in .env}
      POSTGRES_DB: ${DATABASE_NAME:-restaurantos}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    # No `ports:` -- never exposed to the internet, not even to this
    # host's own loopback. Reachable only by the api service (same
    # Compose network) and by scripts/deploy/backup.sh /
    # scripts/deploy/restore.sh, both of which reach it via
    # `docker compose exec`, never a published port.
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DATABASE_USER:-restaurantos}"]
      interval: 10s
      timeout: 5s
      retries: 10

  api:
    build:
      context: ./services/api
      dockerfile: ../../infrastructure/docker/api-prod/Dockerfile
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      APP_ENV: production
      DATABASE_URL: postgresql+asyncpg://${DATABASE_USER:-restaurantos}:${DATABASE_PASSWORD}@postgres:5432/${DATABASE_NAME:-restaurantos}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:?CORS_ALLOWED_ORIGINS must be set to https://admin.prashanthai.com}
      JWT_PRIVATE_KEY: ${JWT_PRIVATE_KEY:?JWT_PRIVATE_KEY must be set}
      JWT_PUBLIC_KEY: ${JWT_PUBLIC_KEY:?JWT_PUBLIC_KEY must be set}
    # No `ports:` -- reached only by caddy, over the internal Compose
    # network at api:8000. Migrations run automatically on container
    # start (see the production Dockerfile's own CMD); scripts/deploy/
    # also runs them explicitly and verifies success before the stack is
    # brought up further, for a clear first-deploy failure point.
    # No `healthcheck:` block needed here -- the image's own HEALTHCHECK
    # (infrastructure/docker/api-prod/Dockerfile) already covers it.

  admin-web:
    build:
      context: ./apps/admin-web
      dockerfile: ../../infrastructure/docker/admin-web-prod/Dockerfile
      args:
        NEXT_PUBLIC_API_BASE_URL: ${NEXT_PUBLIC_API_BASE_URL:?NEXT_PUBLIC_API_BASE_URL must be set to https://api.prashanthai.com}
    restart: unless-stopped
    depends_on:
      - api
    # No `ports:` -- reached only by caddy, at admin-web:3000.
    # NEXT_PUBLIC_API_BASE_URL is a *build* arg (above), not a runtime
    # environment variable -- see the admin-web-prod Dockerfile's own
    # comment on why. Changing it requires `--build`, not just a restart.

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    depends_on:
      - api
      - admin-web
    environment:
      CADDY_ACME_EMAIL: ${CADDY_ACME_EMAIL:?CADDY_ACME_EMAIL must be set in .env -- see infrastructure/reverse-proxy/Caddyfile}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./infrastructure/reverse-proxy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config

volumes:
  postgres_data:
  caddy_data:
  caddy_config:
