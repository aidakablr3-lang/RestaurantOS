[project]
name = "restaurant-os-api"
version = "0.1.0"
description = "RestaurantOS primary synchronous API service"
requires-python = ">=3.13"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "sqlalchemy[asyncio]>=2.0",
    "asyncpg>=0.30",
    "alembic>=1.14",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "argon2-cffi>=23.1",
    "pyjwt[crypto]>=2.9",
    "python-ulid>=2.7",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "ruff>=0.7",
    "mypy>=1.13",
    "httpx>=0.27",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "."]
asyncio_mode = "auto"
# The integration suite's `engine` fixture (tests/integration/conftest.py)
# is session-scoped -- one asyncpg connection pool for the whole test
# session. pytest-asyncio's default is a fresh event loop per test
# function; reusing a connection pool across event loops crashes on
# Windows (asyncpg tries to write to a Proactor transport whose loop has
# already been torn down: "AttributeError: 'NoneType' object has no
# attribute 'send'"). One event loop for the whole session avoids this.
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"
markers = [
    "integration: requires a live PostgreSQL instance (set TEST_DATABASE_URL); skipped otherwise",
]

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.mypy]
python_version = "3.13"
strict = true

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"
